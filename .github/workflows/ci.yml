name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - run: bun install --frozen-lockfile
      # The same gate the release workflow's verify job runs: Biome, type-check,
      # the build (tests/package.test.ts installs the result and runs it under
      # Node; the stdio tests bundle the CLI themselves), then the tests.
      # Change it in package.json, not here.
      - name: Lint, type-check, build, test
        run: bun run verify
