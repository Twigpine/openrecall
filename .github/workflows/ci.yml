name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - run: bun install --frozen-lockfile
      - name: Lint & format (Biome)
        run: bunx biome ci
      - name: Type-check
        run: bun run type-check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Build the Node bundle so the MCP stdio tests also exercise what
      # `npx -y @twigpine/openrecall mcp` runs (dist/openrecall.js under Node).
      - name: Build
        run: bun run build
      - name: Test
        run: bun test
