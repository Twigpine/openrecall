name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - run: bun install --frozen-lockfile
      - name: Lint & format (Biome)
        run: bunx biome ci
      - name: Type-check
        run: bun run type-check
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      # Build the Node bundle so the MCP stdio tests also exercise what
      # `npx -y @twigpine/openrecall mcp` runs (dist/openrecall.js under Node).
      - name: Build
        run: bun run build
      - name: Test
        run: bun test

  # The node storage driver's runtime dependencies are external binaries this
  # repo does not build, so nothing in the suite above can tell whether they are
  # present or at the version the Dockerfile pins. This job reads the image that
  # would actually ship.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      - name: Build the image
        run: docker build -t openrecall:test .
      - name: Both node binaries present and at the pinned version
        run: bun run test:image
