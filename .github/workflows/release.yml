name: release

# release-please drives everything from Conventional Commits on main:
#   1. it opens/updates a "release PR" that bumps the version + CHANGELOG;
#   2. when you merge that PR it creates the GitHub release + tag;
#   3. the publish job then ships npm + a GHCR image.
#
# Publishing runs in the SAME workflow as the release (not on a separate tag
# trigger) because tags created with GITHUB_TOKEN don't trigger other workflows.
#
# No secrets. npm is published through trusted publishing: npmjs.com holds a
# rule naming this repo and this workflow file, and npm exchanges the job's
# OIDC token for a short-lived credential itself, with provenance attached.
# GHCR uses the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # release-please finds a merged release PR by parsing its body (the
      # `---` delimiters and the release-notes heading). If the body was
      # edited out of that shape, it skips the release without an error, so
      # nothing is tagged or published. Turn that silent skip into a failure.
      - name: Fail if a release PR merged without a release
        if: "${{ steps.rp.outputs.release_created != 'true' && startsWith(github.event.head_commit.message, 'chore(main): release') }}"
        run: |
          echo "::error::A release PR merged but release-please created no release. Restore the PR body's '---' delimiters and release notes, then re-run this workflow."
          exit 1

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # what npm's trusted publishing authenticates with
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'
      # Before the tests, not after: the stdio and package suites run the built
      # bundle and the packed tarball under `node`, which should be the floor
      # we declare rather than whatever the runner image ships.
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bunx biome ci && bun run type-check && bun run build && bun test

      # npm, with no token in this job or in the repo's secrets. A version
      # already on the registry is skipped rather than failed, so a re-run of
      # this job (after a GHCR failure, say) and the one-time manual publish
      # that first creates the package both pass through here.
      - name: Publish to npm (trusted publishing)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@twigpine/openrecall@$v" version >/dev/null 2>&1; then
            echo "@twigpine/openrecall@$v is already on npm; skipping publish"
          else
            npm publish --access public
          fi

      # Standalone binaries, for a machine with neither Bun nor Node. Bun
      # cross-compiles every target from one runner. They are handed to the
      # `binaries` job as an artifact rather than uploaded from here: this job
      # holds id-token and packages write and runs bun install, so it keeps
      # contents: read, and only the small job below can write to the release.
      - name: Build standalone binaries
        run: bun run build:binaries
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: binaries/*
          if-no-files-found: error

      # GHCR image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release, nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" binaries/* --repo "$GITHUB_REPOSITORY"
