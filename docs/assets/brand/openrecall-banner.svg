      <stop stop-color="#102C29"/>
      <stop offset="1" stop-color="#0A1D1C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#surface)"/>
  <rect x="740" y="1" width="516" height="438" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="439" rx="23.5" stroke="#AEF4CE" stroke-opacity=".12"/>

