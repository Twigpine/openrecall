<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OpenRecall — Your agents change. Your memory stays.</title>
  <desc id="desc">One encrypted memory across projects, agents, and sessions. Claude Code, Codex, and Cursor connect to OpenRecall, with shared preferences and focused project context.</desc>
